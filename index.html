<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Joke Generator Chatbot</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <header class="hero">
        <div>
          <p class="eyebrow">Single-page chatbot</p>
          <h1>Joke Generator</h1>
          <p class="subtitle">A cheerful little comedian that serves up silly, punny, and laugh-out-loud jokes.</p>
        </div>
        <button id="powerBtn" class="power-btn">Turn on the joke machine</button>
      </header>

      <main class="chat-card" id="chatCard">
        <div class="status-bar">
          <span class="dot"></span>
          <span id="statusText">Offline</span>
        </div>

        <section class="chat-window" id="chatWindow" aria-live="polite">
          <div class="message bot">Hello! Press the button and I’ll brighten your day with jokes.</div>
        </section>

        <div class="llm-settings">
          <label class="setting-group">
            <span>API key</span>
            <input id="apiKeyInput" type="password" placeholder="Optional: paste your OpenRouter/OpenAI key" />
          </label>
          <label class="setting-group">
            <span>Provider</span>
            <select id="providerSelect">
              <option value="openrouter">OpenRouter</option>
              <option value="openai">OpenAI</option>
            </select>
          </label>
        </div>

        <div class="quick-actions">
          <button class="chip" data-prompt="Tell me a funny joke">Funny</button>
          <button class="chip" data-prompt="Give me a pun">Pun</button>
          <button class="chip" data-prompt="Tell me a dad joke">Dad joke</button>
        </div>

        <form id="chatForm" class="chat-form">
          <input id="userInput" type="text" placeholder="Ask for a joke or type your mood..." autocomplete="off" />
          <button type="submit">Send</button>
        </form>
      </main>
    </div>

    <script src="script.js"></script>
  </body>
</html>
